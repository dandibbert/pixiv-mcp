[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixiv-mcp-library"
version = "0.3.2"
description = "Pixiv MCP: rich illustration/manga/novel search and bounded bulk downloads"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12,<2",
  "pixivpy3>=3.7.5,<4",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pixiv-mcp-library = "pixiv_mcp_library.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pixiv_mcp_library*"]
